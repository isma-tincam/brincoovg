name: Deploy Espiral Nova to GitHub Pages

on:
  push:
    branches:
      - juegos
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload game
        uses: actions/upload-pages-artifact@v4
        with:
          path: sites/espiral-nova/dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
